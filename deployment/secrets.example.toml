# ESEMPIO, nessuna credenziale reale. Incollare nei Secrets di Community Cloud.
EDICOLA_CLOUD_DEMO = "1"
EDICOLA_PROFILE_MODE = "accounts"
EDICOLA_ARCHIVE_DIAGNOSTICS = "0"
EDICOLA_PRIVACY_CONTACT = "INSERIRE_CONTATTO_DEL_GESTORE"
GEMINI_API_KEY = "INSERIRE_SOLO_NEI_SECRETS_CLOUD"
# Copiare i modelli effettivamente già verificati nel proprio .env, senza cambiarli.
GEMINI_RAG_MODEL = "COPIARE_IL_PROPRIO_MODELLO"
GEMINI_RAG_TOP_K = "3"
GEMINI_TTS_MODEL = "COPIARE_IL_PROPRIO_MODELLO_TTS"
GEMINI_TTS_VOICE = "Kore"

# Non creare credenziali da questo esempio: configurare manualmente Google/Supabase.
[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "GENERARE_PRIVATAMENTE_UN_SEGRETO_CASUALE_LUNGO"
expose_tokens = []

[auth.google]
client_id = "CLIENT_ID_GOOGLE"
client_secret = "CLIENT_SECRET_GOOGLE"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
client_kwargs = {scope = "openid", prompt = "select_account"}

[personal_database]
host = "HOST_SESSION_POOLER_COPIATO_DA_SUPABASE"
port = 5432
dbname = "postgres"
user = "edicola_app.PROJECT_REF"
password = "PASSWORD_DEL_SOLO_RUOLO_EDICOLA_APP"
sslrootcert = "system"
# Se il certificato del progetto non è riconosciuto dalle CA di sistema:
# sslrootcert = "deployment/supabase-ca.crt"
# Scaricare manualmente la CA pubblica dal dashboard. Non usare una chiave privata.
