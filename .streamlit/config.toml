[browser]
gatherUsageStats = false

[client]
# Menu essenziale: evita strumenti da sviluppatore nell'interfaccia lettore.
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#275D9B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F7FD"
textColor = "#1C2938"
font = "sans-serif"
headingFont = "serif"
baseRadius = "medium"
buttonRadius = "medium"
borderColor = "#E3E8ED"
showWidgetBorder = true

